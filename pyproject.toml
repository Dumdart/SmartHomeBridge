[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-home-bridge"
version = "0.1.0"
description = "A bridge for connecting smart home systems to device integrations"
readme = "README.MD"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt",
    "python-dotenv",
    "smartcoop-python-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
gui = [
    "Pillow",
    "PySide6",
]
inference = [
    "Pillow",
    "ultralytics",
]

[project.scripts]
smart-home-bridge = "smart_home_bridge.__main__:run"
smart-home-bridge-status = "smart_home_bridge.__main__:status"
smart-home-bridge-config-check = "smart_home_bridge.__main__:config_check"
smart-home-bridge-door-command = "smart_home_bridge.__main__:door_command"

[project.gui-scripts]
smart-home-bridge-gui = "smart_home_bridge.gui:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"smart_home_inference.models.chicken_thread.model" = ["chicken_threat_detector_best_v3.pt"]
