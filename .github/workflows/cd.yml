name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release-build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs:
      - ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_versions.py

      - name: Install release build dependencies
        run: uv sync --extra dev --locked

      - name: Build LoxBerry plugins
        run: uv run python scripts/build_loxberry_plugin.py --output-dir dist/Loxberry

      - name: Build Docker images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          DOCKER_TAG="${RELEASE_TAG//+/-}"
          docker build --tag "smart-home-bridge:${DOCKER_TAG}" .
          docker build --file Dockerfile.inference --tag "smart-home-inference:${DOCKER_TAG}" .

      - name: Export Docker images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          DOCKER_TAG="${RELEASE_TAG//+/-}"
          docker image save "smart-home-bridge:${DOCKER_TAG}" | gzip > "dist/smart-home-bridge-${RELEASE_TAG}.tar.gz"
          docker image save "smart-home-inference:${DOCKER_TAG}" | gzip > "dist/smart-home-inference-${RELEASE_TAG}.tar.gz"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-deployments
          path: dist/
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs:
      - release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-deployments
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_OPTIONS=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            RELEASE_OPTIONS+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            dist/*.tar.gz \
            dist/Loxberry/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SmartHomeBridge ${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag \
            "${RELEASE_OPTIONS[@]}"
