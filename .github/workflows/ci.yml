name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate locked dependencies
        run: uv lock --check

      - name: Install test dependencies
        run: uv sync --extra dev --locked

      - name: Run tests
        run: uv run pytest

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build image
        run: docker build -t loxone-bridge:ci .

      - name: Build inference image
        run: docker build -f Dockerfile.inference -t smart-home-inference:ci .
